<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kali@kali: ~</title>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --desktop:#2b3338;
  --panel:#16191c;
  --panel-text:#cfd3d6;
  --win-title:#1b1f22;
  --win-border:#3a4044;
  --term-bg:#0c0f10;
  --term-text:#d7dadb;
  --blue:#6c99ea;
  --green:#4fd17a;
  --white:#f2f2f2;
  --dim:#8a9095;
  --accent:#06b6d4;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--desktop);font-family:"DejaVu Sans Mono","Ubuntu Mono","Courier New",monospace}
body{display:flex;flex-direction:column;overflow:hidden}

/* ===== Kali-style top panel ===== */
#toppanel{
  flex:0 0 auto;height:26px;background:var(--panel);color:var(--panel-text);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;font-size:12px;border-bottom:1px solid #000;
  user-select:none;
}
#toppanel .left,#toppanel .right{display:flex;align-items:center;gap:10px}
#toppanel .dragon{color:var(--accent);font-weight:bold}
#toppanel .wintitle{position:absolute;left:50%;transform:translateX(-50%);color:#9aa0a4;font-size:12px}
#toppanel{position:relative}

/* desktop area behind terminal, with faint kali watermark */
#desktop{
  flex:1;position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse at 60% 45%, #3a4549 0%, #262e32 55%, #1c2225 100%);
}
#watermark{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0.10;pointer-events:none;
}
#watermark svg{width:46vw;max-width:620px;height:auto}

/* ===== terminal window ===== */
#win{
  position:absolute;inset:3% 4%;
  display:flex;flex-direction:column;
  background:var(--term-bg);
  border:1px solid var(--win-border);
  box-shadow:0 18px 50px rgba(0,0,0,.55);
  border-radius:3px;overflow:hidden;
}
#titlebar{
  flex:0 0 auto;background:linear-gradient(#2b3135,#232829);
  color:#d8dadb;font-size:12.5px;padding:5px 8px;
  display:flex;align-items:center;justify-content:center;position:relative;
  border-bottom:1px solid #000;
}
#titlebar .dots{position:absolute;left:8px;display:flex;gap:6px}
#titlebar .dots span{width:10px;height:10px;border-radius:50%;display:inline-block}
#titlebar .dots span:nth-child(1){background:#4a4f52}
#titlebar .dots span:nth-child(2){background:#4a4f52}
#titlebar .dots span:nth-child(3){background:#4a4f52}
#menubar{
  flex:0 0 auto;background:#1c2023;color:#aeb3b6;font-size:12px;
  padding:3px 10px;display:flex;gap:16px;border-bottom:1px solid #000;
  user-select:none;
}
#menubar span:hover{color:#fff}

#controls{
  flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:6px 8px;background:#15181a;border-bottom:1px solid #000;
}
#controls select,#controls button{
  background:#0c0f10;color:var(--term-text);border:1px solid #3a4044;
  font:12px inherit;padding:4px 8px;border-radius:2px;
}
#controls select{flex:1;min-width:170px}
#controls button{cursor:pointer;color:#cfe6ff}
#controls button:hover{background:#1b2226}

#screen{
  flex:1;overflow:auto;padding:10px 14px;
  color:var(--term-text);font-size:13.5px;line-height:1.45;
  white-space:pre-wrap;word-break:break-word;
}
#screen::-webkit-scrollbar{width:10px}
#screen::-webkit-scrollbar-thumb{background:#33383b}

.blue{color:var(--blue)}
.green{color:var(--green)}
.white{color:var(--white)}
.dim{color:var(--dim)}
.out{color:#b9d7ff}
.hdr{color:#7ee787}
.warn{color:#e3b341}
.raw{color:#e6e6e6}

.cur{display:inline-block;width:7px;height:14px;background:var(--term-text);vertical-align:text-bottom;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

@media (max-width:640px){
  #win{inset:1% 1%}
  #menubar{flex-wrap:wrap;gap:10px}
  #screen{font-size:12.5px}
}
</style>
</head>
<body>

<div id="toppanel">
  <div class="left"><span class="dragon">🐉</span><span>Applications</span><span>Places</span></div>
  <div class="wintitle">kali@kali: ~</div>
  <div class="right"><span id="clock">kali@kali</span></div>
</div>

<div id="desktop">
  <div id="watermark">
    <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <rect x="40" y="150" width="200" height="90" fill="none" stroke="#ffffff" stroke-width="3"/>
      <text x="140" y="208" font-family="DejaVu Sans Mono, monospace" font-size="42" fill="#ffffff" text-anchor="middle">KALI</text>
      <path d="M60 60 C140 90 170 150 120 200 C170 190 230 150 220 90 C260 120 270 180 230 220 C280 210 320 150 300 90"
            fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>

  <div id="win">
    <div id="titlebar"><span class="dots"><span></span><span></span><span></span></span>kali@kali: ~</div>
    <div id="menubar"><span>Session</span><span>Actions</span><span>Edit</span><span>View</span><span>Help</span></div>
    <div id="controls">
      <select id="sel" aria-label="Select program"></select>
      <button id="run">Run</button><button id="prev">&lt; Prev</button><button id="next">Next &gt;</button><button id="src">Source</button><button id="clr">Clear</button>
    </div>
    <div id="screen"></div>
  </div>
</div>

<script>
const P=[
{n:"2",title:"NETWORK SCANNING AND INFORMATION GATHERING",
aim:"To gather network information using Whois, Nmap and Traceroute.",
alg:["Use Whois to collect domain information.","Use Nmap to discover active hosts.","Identify services and versions.","Identify operating system.","View network path using Traceroute."],
code:[{c:`whois example.com

nmap -sn 192.168.1.0/24

nmap -sV -sC -p 1-1000 192.168.1.10

nmap -O 192.168.1.10

traceroute example.com`}],
out:`Whois:
Domain Name: example.com

Nmap:
Host is up.

Service:
PORT     STATE    SERVICE
80/tcp   open     http

OS:
OS details: Linux

Traceroute:
1  192.168.1.1
2  ...`},
{n:"4",sub:"UFW",title:"FIREWALL USING UFW",
aim:"To configure a firewall using UFW in Linux.",
alg:["Set default incoming traffic to deny.","Allow outgoing traffic.","Allow SSH and HTTP connections.","Block Telnet connections.","Enable the firewall.","Check firewall status."],
code:[{c:`sudo ufw default deny incoming
sudo ufw default allow outgoing
sudo ufw allow 22/tcp comment 'Allow SSH'
sudo ufw allow 80/tcp comment 'Allow HTTP'
sudo ufw deny 23/tcp comment 'Block Telnet'
sudo ufw enable
sudo ufw status verbose`}],
out:`Status: active
Default: deny (incoming), allow (outgoing)

22/tcp   ALLOW
80/tcp   ALLOW
23/tcp   DENY`},
{n:"4",sub:"IPTables",title:"FIREWALL USING IPTABLES",
aim:"To configure firewall rules using IPTables.",
alg:["Clear existing firewall rules.","Allow loopback traffic.","Allow SSH connections.","Block Telnet connections.","Allow established connections.","Set default incoming policy to DROP.","Display firewall rules."],
code:[{c:`sudo iptables -F
sudo iptables -A INPUT -i lo -j ACCEPT
sudo iptables -A INPUT -p tcp --dport 22 -j ACCEPT
sudo iptables -A INPUT -p tcp --dport 23 -j DROP
sudo iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
sudo iptables -P INPUT DROP
sudo iptables -L -v -n`}],
out:`Chain INPUT (policy DROP)
ACCEPT  all  --  lo
ACCEPT  tcp  --  anywhere  tcp dpt:22
DROP    tcp  --  anywhere  tcp dpt:23`},
{n:"6",title:"PASSWORD AUDITING USING JOHN THE RIPPER",
aim:"To perform password auditing using John the Ripper.",
alg:["Create a test user.","Set a password.","Prepare password information for an authorized audit.","Run John the Ripper.","Display the results."],
code:[{c:`sudo useradd testuser
echo "testuser:password123" | sudo chpasswd
sudo unshadow /etc/passwd /etc/shadow > mypasswd.txt
john --wordlist=/usr/share/wordlists/rockyou.txt mypasswd.txt
john --show mypasswd.txt`}],
out:`Created user: testuser
Loaded 1 password hash
testuser:password123
1 password hash cracked`},
{n:"7",title:"DOCKER, DVWA AND OWASP ZAP",
aim:"To install Docker, run DVWA and open OWASP ZAP.",
alg:["Install Docker.","Start Docker service.","Enable Docker.","Run DVWA container.","Check running container.","Open DVWA in browser.","Install OWASP ZAP.","Launch OWASP ZAP."],
code:[{c:`sudo apt install -y docker.io
sudo systemctl start docker
sudo systemctl enable docker
sudo docker run -d --name dvwa -p 80:80 vulnerables/web-dvwa
sudo docker start dvwa
sudo docker ps
http://localhost
sudo apt install -y zaproxy
zaproxy`}],
out:`Docker installed successfully.
Container is running.
DVWA: http://localhost
OWASP ZAP started successfully.`},
{n:"8",title:"CAESAR CIPHER AND AES ENCRYPTION",
aim:"To perform encryption and decryption using Caesar Cipher and AES.",
alg:["Caesar Cipher:","1. Get the message.","2. Select shift value.","3. Encrypt the message.","4. Decrypt the message.","5. Display the result.","AES:","1. Generate a random key.","2. Create AES cipher.","3. Encrypt the message.","4. Decrypt the message.","5. Display the result."],plain:true,
code:[{c:`pip install pycryptodome`},{raw:true,c:`from Crypto.Cipher import AES
from Crypto.Util.Padding import pad, unpad
from Crypto.Random import get_random_bytes

def caesar_encrypt(text, shift):
    result = ""

    for char in text:
        if char.isalpha():
            base = 65 if char.isupper() else 97
            result += chr((ord(char) - base + shift) % 26 + base)
        else:
            result += char

    return result


def caesar_decrypt(text, shift):
    return caesar_encrypt(text, -shift)


msg = "HELLO CYBER SECURITY"

enc = caesar_encrypt(msg, 3)
dec = caesar_decrypt(enc, 3)

print("Caesar Encrypted:", enc)
print("Caesar Decrypted:", dec)


key = get_random_bytes(16)

cipher = AES.new(key, AES.MODE_CBC)
iv = cipher.iv

plaintext = b"Secret Cyber Warfare Message"

ciphertext = cipher.encrypt(pad(plaintext, AES.block_size))

print("AES Ciphertext (hex):", ciphertext.hex())

decipher = AES.new(key, AES.MODE_CBC, iv)

decrypted = unpad(decipher.decrypt(ciphertext), AES.block_size)

print("AES Decrypted:", decrypted.decode())`}],
out:`Caesar Encrypted: KHOOR FB EHU VHFXULWB
Caesar Decrypted: HELLO CYBER SECURITY

AES Ciphertext (hex): [random hexadecimal value]

AES Decrypted: Secret Cyber Warfare Message`},
{n:"9",title:"FILE INTEGRITY USING SHA-256",
aim:"To check file integrity using SHA-256 hashing.",
alg:["Create a test file.","Generate original SHA-256 hash.","Display original hash.","Modify the file.","Generate a new hash.","Compare both hashes.","Display the result."],
code:[{c:`echo "This is a test file for integrity check." > testfile.txt

openssl dgst -sha256 testfile.txt > original_hash.txt

cat original_hash.txt

echo "Malicious modification" >> testfile.txt

openssl dgst -sha256 testfile.txt > new_hash.txt

cat new_hash.txt

if diff original_hash.txt new_hash.txt > /dev/null; then
    echo "File integrity intact - no changes detected."
else
    echo "File integrity COMPROMISED - hash mismatch!"
fi`}],
out:`SHA2-256(testfile.txt)= [original hash]
SHA2-256(testfile.txt)= [new hash]

File integrity COMPROMISED - hash mismatch!`},
{n:"10",title:"INTRUSION DETECTION USING SNORT",
aim:"To detect ICMP ping packets using Snort.",
alg:["Install Snort.","Open local rules file.","Add ICMP detection rule.","Check network interface.","Start Snort.","Send ping packets in the lab.","Observe alerts."],
code:[{c:`sudo apt install -y snort

sudo nano /etc/snort/rules/local.rules`},{raw:true,c:`alert icmp any any -> any any (msg:"ICMP Ping Detected"; sid:1000001; rev:1;)`},{c:`ip a

sudo snort -c /etc/snort/snort.lua -R /etc/snort/rules/local.rules -i wlp45s0 -A alert_fast -q

ping -c 4 8.8.8.8`}],
out:`ICMP Ping Detected
ICMP Ping Detected
ICMP Ping Detected
ICMP Ping Detected`},
{n:"11",title:"BASIC MALWARE FILE ANALYSIS",
aim:"To analyze a sample file using Linux security tools.",
alg:["Install ExifTool, Binutils and File.","Create a sample file.","Check file type.","Extract readable strings.","Generate SHA-256 hash.","Display file metadata."],
code:[{c:`sudo apt install -y exiftool binutils file

echo "This is a dummy test file to simulate malware analysis." > suspicious.exe

file suspicious.exe

strings suspicious.exe | head -n 20

sha256sum suspicious.exe

exiftool suspicious.exe`}],
out:`suspicious.exe: ASCII text

This is a dummy test file to simulate malware analysis.

SHA256: [hash value]

File Name: suspicious.exe
File Type: TXT`},
{n:"12",title:"SECURE REMOTE ACCESS USING SSH AND SCP",
aim:"To transfer files securely between two computers using SSH and SCP.",
alg:["Install SSH server.","Start SSH service.","Check SSH status.","Find IP address and username.","Connect to remote computer.","Create a test file.","Transfer file using SCP.","Check transferred file."],
code:[{c:`sudo apt install openssh-server -y

sudo systemctl start ssh

sudo systemctl status ssh

ip addr & whoami

ssh kali@192.168.56.102

echo "Secure Remote Access using SSH and SCP" > test.txt

cat test.txt

scp test.txt kali@192.168.56.102:/home/kali/

ls

cat test.txt`}],
out:`Active: active (running)

Secure Remote Access using SSH and SCP

test.txt

Secure Remote Access using SSH and SCP`}
];
const $=id=>document.getElementById(id),T=$("screen"),sel=$("sel");
let tok=0;
const lab=p=>"Program "+p.n+(p.sub?" ("+p.sub+")":"")+" - "+p.title;
P.forEach((p,i)=>sel.add(new Option(lab(p),i)));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function add(txt,cls){const s=document.createElement("span");if(cls)s.className=cls;s.textContent=txt;T.appendChild(s);T.scrollTop=T.scrollHeight;return s}
function prompt(){
  // ┌──(kali㉿kali)-[~]
  // └─$
  const line1=document.createElement("div");
  line1.innerHTML='<span class="blue">┌──(</span><span class="green">kali㉿kali</span><span class="blue">)-[</span><span class="white">~</span><span class="blue">]</span>';
  T.appendChild(line1);
  const l2=document.createElement("span");
  l2.innerHTML='<span class="blue">└─</span><span class="white">$</span> ';
  T.appendChild(l2);
}
function cursor(){const c=document.createElement("span");c.className="cur";c.id="cur";T.appendChild(c);T.scrollTop=T.scrollHeight}
function rmc(){const c=$("cur");if(c)c.remove()}
function idle(){prompt();cursor()}

function welcome(){
  T.textContent="";
  add("Linux kali 6.6.15-amd64 x86_64\n","dim");
  add("Last login: "+new Date().toDateString()+" on tty1\n","dim");
  add("\nCyber Security Lab Exam Terminal\n","hdr");
  add("Programs available: "+P.map(p=>p.n+(p.sub?" ("+p.sub+")":"")).join(", ")+"\n","dim");
  add("Programs 1, 3 and 5 were not in the lab content provided, so they are not listed.\n","warn");
  add("Select a program above and press Run.\n\n","dim");
  idle();
}
function banner(p){
  add("="+"=".repeat(58)+"\n","dim");
  add("PROGRAM "+p.n+(p.sub?" ("+p.sub+")":"")+" - "+p.title+"\n","hdr");
  add("="+"=".repeat(58)+"\n","dim");
  add("AIM:\n","white");add(p.aim+"\n\n");
  add("ALGORITHM:\n","white");
  p.alg.forEach((a,i)=>add((p.plain?"":(i+1)+". ")+a+"\n"));
  add("\n");
}
function sourceOf(p){return p.code.map(s=>s.c).join("\n")}

async function run(i){
  const my=++tok;sel.value=i;const p=P[i];
  T.textContent="";banner(p);
  add("[SIMULATION] This is a simulated session, not real execution. Commands are shown exactly as in your lab record; the output is the expected output from your record.\n\n","warn");
  for(const seg of p.code){
    for(const line of seg.c.split("\n")){
      if(my!==tok)return;
      if(seg.raw){add(line+"\n","raw");await sleep(20);continue}
      if(line===""){add("\n");continue}
      prompt();
      for(const ch of line){if(my!==tok)return;add(ch,"raw");await sleep(10)}
      add("\n");await sleep(220);
    }
  }
  if(my!==tok)return;
  add("\n--- EXPECTED OUTPUT (from lab record) ---\n","warn");
  for(const line of p.out.split("\n")){if(my!==tok)return;add(line+"\n","out");await sleep(55)}
  add("\n");idle();
}
function show(i){
  tok++;sel.value=i;const p=P[i];
  T.textContent="";banner(p);
  add("SOURCE CODE (original):\n","white");
  add(sourceOf(p)+"\n\n");
  add("EXPECTED OUTPUT (from lab record):\n","white");
  add(p.out+"\n\n","out");
  add("Press Run to simulate live execution in the terminal.\n","dim");
  idle();
}
$("run").onclick=()=>run(+sel.value);
$("next").onclick=()=>run(Math.min(P.length-1,+sel.value+1));
$("prev").onclick=()=>run(Math.max(0,+sel.value-1));
$("src").onclick=()=>show(+sel.value);
$("clr").onclick=()=>{tok++;welcome()};
sel.onchange=()=>show(+sel.value);
welcome();
</script>
</body>
</html>
